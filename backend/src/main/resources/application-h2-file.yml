# Configuration H2 en mode fichier (données persistantes)
spring:
  application:
    name: collector-shop
  datasource:
    # H2 en mode fichier - les données sont sauvegardées dans backend/data/collector.mv.db
    url: jdbc:h2:file:./data/collector;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

collector:
  fraud:
    outbound-url: https://fraud-gateway.example.com/hooks
