spring:
  application:
    name: collector-shop
  profiles:
    default: mysql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

collector:
  fraud:
    outbound-url: https://fraud-gateway.example.com/hooks
  auth:
    mode: ${COLLECTOR_AUTH_MODE:legacy}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      all: false
      "http.server.requests": true
      "jvm": true
      "process": true
      "system": true
      "tomcat": true
      "hikaricp": true




