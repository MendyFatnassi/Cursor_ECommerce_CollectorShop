spring:
  application:
    name: collector-shop
  datasource:
    url: jdbc:h2:mem:collector;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

collector:
  fraud:
    outbound-url: https://fraud-gateway.example.com/hooks




