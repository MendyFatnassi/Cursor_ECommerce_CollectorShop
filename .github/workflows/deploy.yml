name: CI + Deploy to VPS
on:
  push:
    branches: [ main, staging ]
  workflow_call:
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_PORT:
        required: true
      DEPLOY_SSH_KEY:
        required: true

jobs:
  ci:
    uses: ./.github/workflows/github-actions.yml

  deploy-staging:
    runs-on: ubuntu-24.04
    needs: ci
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /srv/collectorshop/projetTestCursorCube3-staging
            git fetch --all
            git reset --hard origin/staging
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build

  deploy-prod:
    runs-on: ubuntu-24.04
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /srv/collectorshop/projetTestCursorCube3
            git fetch --all
            git reset --hard origin/main
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
