name: Github Actions
run-name: CI/CD Actions
on: [push]
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # ----------- BACKEND -----------
      # configuration backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # test backend
      - name: Run Maven tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn verify

      # ----------- FRONTEND -----------
      # configuration frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

        # test frontend
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:coverage  
          
  CD:
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------- BACKEND -----------
      # configuration backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # build backend
      - name: Build backend
        working-directory: ./backend
        run: mvn package

      # ----------- FRONTEND -----------
      # configuration frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # build frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build  
      
