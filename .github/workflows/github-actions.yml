name: Github Actions
run-name: CI/CD Actions
on: [push]
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # configuration backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # test backend
      - name: Run Maven tests
        working-directory: ./backend
        run: mvn test 

      # test frontend
      - name: Run npm tests
        working-directory: ./frontend
        run: npm test  
          
  CD:
    runs-on: ubuntu-latest
    needs: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # build backend
      - name: Build backend
        working-directory: ./backend
        run: mvn package

      # build frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build  
      
