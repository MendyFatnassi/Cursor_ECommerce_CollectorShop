name: CI
run-name: CI (tests + couverture)
on:
  workflow_call: {}
  push:
    branches-ignore:
      - main
      - staging
jobs:
  CI:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Backend coverage summary
        working-directory: ./backend
        run: |
          echo "## Couverture de tests" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/jacoco.csv ]; then
            LINE_PCT=$(awk -F, 'NR>1 {missed+=$8; covered+=$9} END {total=missed+covered; if (total>0) printf "%.2f", (covered*100/total); else printf "0.00"}' target/site/jacoco/jacoco.csv)
            echo "- Backend (lines): ${LINE_PCT}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Backend: rapport JaCoCo introuvable" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Frontend coverage summary
        working-directory: ./frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINE_PCT=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('coverage/coverage-summary.json')); console.log(s.total?.lines?.pct ?? 0)")
            echo "- Frontend (lines): ${LINE_PCT}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Frontend: rapport de couverture introuvable" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage