services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-collectorshop}
      MYSQL_USER: ${MYSQL_USER:-collectorshop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    depends_on:
      - mysql
    ports:
      - "8083:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-mysql}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-collectorshop_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "8082:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  mysql-data:
  cloudbeaver-data:
