services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - m2-cache:/root/.m2
    develop:
      watch:
        - path: ./backend/src
          target: /workspace/src
          action: sync+restart
        - path: ./backend/pom.xml
          action: rebuild
    ports:
      # 8080 hôte est souvent déjà utilisé (Spring/containers). On expose sur 8082 côté hôte.
      - "8082:8080"
    command: >
      mvn -DskipTests spring-boot:run

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8080
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync+restart
          ignore:
            - node_modules/
    ports:
      # Front servi par nginx sur 80 dans le conteneur
      - "8081:8080"

volumes:
  m2-cache:

