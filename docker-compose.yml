services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: collectorshop_dev
      MYSQL_USER: collectorshop_user
      MYSQL_PASSWORD: collectorshop_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    depends_on:
      - mysql
    ports:
      - "8083:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      - mysql
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - m2-cache:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=collectorshop_dev
      - MYSQL_USER=collectorshop_user
      - MYSQL_PASSWORD=collectorshop_password
    develop:
      watch:
        - path: ./backend/src
          target: /workspace/src
          action: sync+restart
        - path: ./backend/pom.xml
          action: rebuild
    ports:
      # 8080 hôte est souvent déjà utilisé (Spring/containers). On expose sur 8082 côté hôte.
      - "8082:8080"
    command: >
      mvn -DskipTests spring-boot:run

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8080
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync+restart
          ignore:
            - node_modules/
    ports:
      # Front servi par nginx sur 80 dans le conteneur
      - "8081:8080"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-q1Sh-9_ISia_zwGINzRvyQ}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-q1Sh-9_ISia_zwGINzRvyQ}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    depends_on:
      - kafka
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      - backend
      - kafka-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  m2-cache:
  mysql-data:
  cloudbeaver-data:
  kafka-data:
  prometheus-data:
  grafana-data:

